name: update

on:
  schedule:
    - cron: "0 21 * * *"  # 毎朝6:00（日本時間）
  workflow_dispatch:       # GitHubの画面から手動でも実行できる

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch.py
      - name: 取得結果を保存
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add index.html data.json credits.json
          git diff --cached --quiet || git commit -m "update schedule"
          git push
      - name: 公開用フォルダを用意
        run: |
          mkdir _site
          cp index.html _site/
          printf "User-agent: *\nDisallow: /\n" > _site/robots.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
